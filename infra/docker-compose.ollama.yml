# Ollama 서버 (gemma3:12b 등 GGUF 모델 서빙, OpenAI 호환 API 제공).
# vLLM과 달리 VRAM이 모자라면 일부 레이어를 CPU로 자동 오프로드하므로,
# RTX 4060 8GB처럼 12B 모델에 VRAM이 빠듯한 GPU에서도 (느리더라도) 구동 가능하다.
# 실행: docker compose -f infra/docker-compose.ollama.yml up -d
# 모델 다운로드(최초 1회, 컨테이너 기동 후 실행): docker exec airead-ollama ollama pull gemma3:12b
# 헬스체크: curl http://localhost:11434/v1/models
# WAS 서버에서 사용하려면 .env에 LLM_MODEL=gemma3-12b 설정 후 재시작하세요.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: airead-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

volumes:
  ollama-models:
