services:
  - type: web
    name: airead
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIR
        value: /tmp/airead-data
      - key: TEACHER_PASSWORD
        value: "0000"
      - key: LLM_ENABLED
        value: "false"
      - key: NL_OPEN_API_KEY
        sync: false
      - key: NL_OPEN_API_BASE_URL
        value: https://www.nl.go.kr/NL/search/openApi/saseoApi.do
      - key: NL_OPEN_API_TIMEOUT_MS
        value: "10000"
